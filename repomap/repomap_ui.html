<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repo Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a map of every module (each function one cell) on the left, a panel for the change and the
   picked function on the right; cells take the colour of their part in the change. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2230; --muted: #5d6676; --line: #dde1e8;
  --accent: #2856c7; --accent-soft: #e5ecfb;
  --chg: #c2410c; --chg-soft: #fbe6da; --l1: #b7791f; --l1-soft: #f6ead2; --l2: #d6b25e;
  --heat: #2856c7; --empty: #c7ccd5;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --panel: #181d26; --fg: #e3e7ee; --muted: #98a1b2; --line: #2a313d;
  --accent: #7ea2ff; --accent-soft: #1f2a45;
  --chg: #fb8b52; --chg-soft: #3b2216; --l1: #e3b552; --l1-soft: #33290f; --l2: #8f7a3f;
  --heat: #7ea2ff; --empty: #3a4250;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #181d26; --fg: #e3e7ee; --muted: #98a1b2; --line: #2a313d;
  --accent: #7ea2ff; --accent-soft: #1f2a45;
  --chg: #fb8b52; --chg-soft: #3b2216; --l1: #e3b552; --l1-soft: #33290f; --l2: #8f7a3f;
  --heat: #7ea2ff; --empty: #3a4250;
  color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; max-width: 1500px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; text-wrap: balance; }
h1 span { color: var(--muted); font-weight: 400; }
.stats { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1 1 420px; justify-content: flex-end; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search input { width: 100%; font: 13px var(--sans); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.search input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); max-height: 340px; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 6px 10px; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results small { color: var(--muted); display: block; font-family: var(--mono); font-size: 11px; }
button { font: 500 13px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 400; text-align: left; }
button.link:hover { text-decoration: underline; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.map { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.pkg { margin-top: 14px; }
.pkg:first-of-type { margin-top: 0; }
.pkg > h3 { font: 500 11.5px var(--mono); color: var(--muted); margin: 0 0 6px; letter-spacing: .02em; }
.mods { display: flex; flex-wrap: wrap; gap: 8px; }
.mod { border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px 7px; min-width: 0; max-width: 100%; }
.mod.hot { border-color: var(--chg); }
.mod.warm { border-color: var(--l1); }
.mod.dim { opacity: .45; }
.mod h4 { margin: 0 0 5px; font: 500 11.5px var(--mono); display: flex; gap: 8px; justify-content: space-between; }
.mod h4 span { color: var(--muted); font-weight: 400; }
.cells { display: grid; grid-template-columns: repeat(var(--cols), 11px); gap: 2px; }
.cell { width: 11px; height: 11px; border-radius: 2px; border: 0; padding: 0; cursor: pointer; background: var(--heat); }
.cell.none { background: transparent; box-shadow: inset 0 0 0 1px var(--empty); }
.cell:hover { outline: 2px solid var(--fg); outline-offset: 0; }
.cell.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.impact-on .cell { background: var(--empty); opacity: .5; box-shadow: none; }
.impact-on .cell.c0 { background: var(--chg); opacity: 1; }
.impact-on .cell.c1 { background: var(--l1); opacity: 1; }
.impact-on .cell.c2 { background: var(--l2); opacity: 1; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--fg); color: var(--bg); font: 11.5px var(--mono); padding: 4px 7px; border-radius: 4px; max-width: 420px; }
aside { display: flex; flex-direction: column; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow: auto; padding-bottom: 8px; min-width: 0; }
@media (max-width: 980px) { aside { position: static; max-height: none; order: -1; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 2px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.big { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 12px; font-variant-numeric: tabular-nums; }
.big div { min-width: 70px; }
.big b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; }
.big span { color: var(--muted); font-size: 12px; }
.sec { border-top: 1px solid var(--line); padding-top: 9px; margin-top: 10px; }
.sec > h5 { margin: 0 0 6px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sec > h5 span { color: var(--muted); font-weight: 400; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); padding: 2px 4px 2px 7px; margin: 0 4px 4px 0; border-radius: 4px; background: var(--chg-soft); max-width: 100%; }
.chip.l1 { background: var(--l1-soft); }
.chip.l2 { background: var(--accent-soft); }
.chip button { border: 0; background: none; padding: 0 3px; color: var(--muted); font-size: 13px; line-height: 1; }
.chip .nm { overflow-wrap: anywhere; cursor: pointer; }
ul.plain { list-style: none; padding: 0; margin: 0; }
ul.plain li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; font: 12px var(--mono); }
ul.plain li span:first-child { overflow-wrap: anywhere; min-width: 0; }
ul.plain li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.modrow { font-size: 12px; margin-bottom: 5px; }
.modrow b { font: 500 12px var(--mono); }
.modrow .nm { color: var(--muted); font-family: var(--mono); }
pre.cmd { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 130px; overflow: auto; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 12.5px; }
.warn { color: var(--l1); font-size: 12.5px; }
.depth { display: inline-flex; gap: 0; }
.depth button { border-radius: 0; padding: 3px 9px; font-size: 12px; }
.depth button:first-child { border-radius: 5px 0 0 5px; }
.depth button:last-child { border-radius: 0 5px 5px 0; }
.depth button.on { background: var(--accent-soft); border-color: var(--accent); }
.fnkey { font: 500 13px var(--mono); overflow-wrap: anywhere; margin: 6px 0 2px; }
.nb { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px 8px; align-items: center; margin-top: 4px; }
.nb .col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.nb .col.r { align-items: flex-start; }
.nb .col.l { align-items: flex-end; text-align: right; }
.nb .me { font: 500 12px var(--mono); padding: 5px 8px; border-radius: 5px; background: var(--accent-soft); text-align: center; max-width: 140px; overflow-wrap: anywhere; }
.nb .n { font: 11.5px var(--mono); overflow-wrap: anywhere; max-width: 100%; }
.nb .arrow { color: var(--muted); font-size: 11px; }
table.vals { width: 100%; border-collapse: collapse; font-size: 12px; }
table.vals td { padding: 4px 6px 4px 0; vertical-align: top; border-top: 1px solid var(--line); }
table.vals td:first-child { font-family: var(--mono); white-space: nowrap; }
.gap { color: var(--chg); font-size: 11.5px; }
.tag { font-size: 11px; color: var(--muted); }
.err { color: var(--chg); }
@media (prefers-reduced-motion: no-preference) { .cell { transition: background-color .15s, opacity .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Repo map</h1>
      <div class="stats" id="stats">Loading the memory…</div>
    </div>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Find a function, or path.py:LINE" autocomplete="off" aria-label="Find a function">
        <div class="results" id="results" hidden></div>
      </div>
      <button id="mine" class="primary" title="Diff the working tree against what the memory traced">My uncommitted changes</button>
      <button id="clear">Clear</button>
    </div>
  </header>
  <div class="grid">
    <section class="map" id="map">
      <div class="legend" id="legend"></div>
      <div id="pkgs"></div>
    </section>
    <aside>
      <div class="card" id="impact"></div>
      <div class="card" id="fn" hidden></div>
    </aside>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<script id="embedded" type="application/json"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
let D, F = [], up = [], down = [], byKey = new Map(), live = true;
const S = {targets: new Set(), testFiles: [], unknown: [], source: null, depth: 2, sel: null, stale: []};
const PROBES = {str: ["empty"], bytes: ["empty"], list: ["empty"], tuple: ["empty"], dict: ["empty"], int: ["zero", "negative"], float: ["zero", "negative"]};

const file = k => k.split(":")[0];
const qual = k => k.slice(k.indexOf(":") + 1);
const modName = k => file(k).replace(/(\/__init__)?\.py$/, "").replaceAll("/", ".");
const short = k => { const q = qual(k).replace(/\.<locals>\./g, "›"); return q; };

async function boot() {
  const emb = $("#embedded").textContent.trim();
  let changes = null;
  if (emb) { const e = JSON.parse(emb); D = e.data; changes = e.changes; live = false; }
  else {
    try { D = await (await fetch("/api/data")).json(); }
    catch (e) { $("#stats").innerHTML = `<span class="err">Could not reach the repomap server. Start it with <code>repomap.py serve</code>.</span>`; return; }
    if (D.error) { $("#stats").innerHTML = `<span class="err">${esc(D.error)}</span>`; return; }
  }
  F = D.fns.map(([k, s, e, t], i) => ({i, k, s, e, t, mod: k.endsWith(":<module level>"), v: D.vals[i]}));
  F.forEach(f => byKey.set(f.k, f.i));
  up = F.map(() => []); down = F.map(() => []);
  for (const [a, b] of D.edges) { up[b].push(a); down[a].push(b); }
  S.stale = D.stale || [];
  $("#title").innerHTML = `Repo map <span>· ${esc(D.name)}</span>`;
  const tested = F.filter(f => !f.mod && f.t.length).length, total = F.filter(f => !f.mod).length;
  $("#stats").textContent = `${D.tests.length.toLocaleString()} tests · ${tested} of ${total} functions run by a test · ${D.edges.length.toLocaleString()} call edges · traced snapshot ${D.commit}`;
  document.title = `Repo Map · ${D.name}`;
  if (!live) { $("#mine").textContent = "Changes at export"; $("#mine").disabled = !changes; if (!changes) $("#mine").hidden = true; }
  drawMap();
  if (changes) applyChanges(changes);
  else if (live) await loadMine(true);
  render();
}

function drawMap() {
  const pkgs = new Map();
  for (const f of F) {
    const fl = file(f.k), dir = fl.includes("/") ? fl.slice(0, fl.lastIndexOf("/")) : fl;
    if (!pkgs.has(dir)) pkgs.set(dir, new Map());
    const mods = pkgs.get(dir);
    if (!mods.has(fl)) mods.set(fl, []);
    if (!f.mod) mods.get(fl).push(f);
  }
  const max = Math.max(...F.map(f => f.t.length));
  let html = "";
  for (const [dir, mods] of [...pkgs].sort()) {
    html += `<div class="pkg"><h3>${esc(dir)}/</h3><div class="mods">`;
    for (const [fl, fs] of [...mods].sort()) {
      if (!fs.length) continue;
      fs.sort((a, b) => a.s - b.s);
      const cols = Math.min(fs.length, Math.max(6, Math.ceil(Math.sqrt(fs.length * 2.2))));
      const n = new Set(fs.flatMap(f => f.t)).size;
      html += `<div class="mod" data-file="${esc(fl)}"><h4>${esc(fl.slice(fl.lastIndexOf("/") + 1))}<span>${n} tests</span></h4><div class="cells" style="--cols:${cols}">`;
      for (const f of fs) {
        const op = f.t.length ? (0.25 + 0.75 * Math.log1p(f.t.length) / Math.log1p(max)).toFixed(2) : 0;
        html += `<button class="cell${f.t.length ? "" : " none"}" data-i="${f.i}" style="${f.t.length ? `opacity:${op}` : ""}" aria-label="${esc(qual(f.k))}"></button>`;
      }
      html += `</div></div>`;
    }
    html += `</div></div>`;
  }
  $("#pkgs").innerHTML = html;
  const tip = $("#tip");
  $("#pkgs").addEventListener("mousemove", e => {
    const c = e.target.closest(".cell");
    if (!c) { tip.hidden = true; return; }
    const f = F[+c.dataset.i];
    tip.textContent = `${qual(f.k)}  ·  ${f.t.length} tests`;
    tip.hidden = false;
    const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
  });
  $("#pkgs").addEventListener("mouseleave", () => tip.hidden = true);
  $("#pkgs").addEventListener("click", e => {
    const c = e.target.closest(".cell");
    if (!c) return;
    const i = +c.dataset.i;
    if (e.shiftKey || e.metaKey || e.ctrlKey) toggleTarget(i); else select(i);
  });
}

function compute() {
  const targets = [...S.targets];
  const seen = new Set(targets), layers = [];
  let frontier = targets.filter(i => !F[i].mod);
  for (let d = 0; d < S.depth && frontier.length; d++) {
    const nxt = [];
    for (const i of frontier) for (const c of up[i]) if (!seen.has(c)) { seen.add(c); nxt.push(c); }
    if (!nxt.length) break;
    layers.push(nxt); frontier = nxt;
  }
  const tests = new Set();
  for (const i of targets) for (const t of F[i].t) tests.add(t);
  for (const tf of S.testFiles) D.tests.forEach(([t], j) => { if (t.startsWith(tf)) tests.add(j); });
  const untested = targets.filter(i => !F[i].mod && !F[i].t.length);
  return {targets, layers, tests: [...tests], untested};
}

function render() {
  const r = compute(), on = S.targets.size > 0 || S.testFiles.length > 0;
  const state = new Map();
  r.targets.forEach(i => state.set(i, 0));
  r.layers.forEach((l, d) => l.forEach(i => state.set(i, d + 1 > 2 ? 2 : d + 1)));
  // a <module level> change lights the module, not a cell
  const hotFiles = new Set(r.targets.map(i => file(F[i].k))), warmFiles = new Set(r.layers.flat().map(i => file(F[i].k)));
  $("#map").classList.toggle("impact-on", on);
  for (const c of document.querySelectorAll(".cell")) {
    const i = +c.dataset.i, s = state.get(i);
    c.classList.remove("c0", "c1", "c2");
    if (s !== undefined) c.classList.add("c" + s);
    c.classList.toggle("sel", i === S.sel);
  }
  for (const m of document.querySelectorAll(".mod")) {
    const fl = m.dataset.file;
    m.classList.toggle("hot", on && hotFiles.has(fl));
    m.classList.toggle("warm", on && !hotFiles.has(fl) && warmFiles.has(fl));
    m.classList.toggle("dim", on && !hotFiles.has(fl) && !warmFiles.has(fl));
  }
  $("#legend").innerHTML = on
    ? `<span><i style="background:var(--chg)"></i>changed</span><span><i style="background:var(--l1)"></i>direct callers</span><span><i style="background:var(--l2)"></i>callers of callers${S.depth > 2 ? " and up" : ""}</span><span><i style="background:var(--empty)"></i>not reached</span><span>Shift-click a cell to add or remove it from the change</span>`
    : `<span><i style="background:var(--heat)"></i>run by tests (darker = more tests)</span><span><i style="box-shadow:inset 0 0 0 1px var(--empty)"></i>no test runs it</span><span>Click a cell to inspect it, shift-click to add it to a change</span>`;
  renderImpact(r, on);
  renderFn();
}

function renderImpact(r, on) {
  const el = $("#impact");
  const staleNote = S.stale.length ? `<p class="warn">${S.stale.length} library file${S.stale.length > 1 ? "s" : ""} changed since the memory was traced. Run <code>repomap.py refresh</code> after you're done to fold them in.</p>` : "";
  if (!on) {
    el.innerHTML = `<h2>Impact</h2><p class="note">${S.source === "mine" ? "No changes to library or test code since the memory was traced." : "Nothing picked yet."} Pick functions to see what depends on them and which tests run them: search above, shift-click cells, or ${live ? "press <b>My uncommitted changes</b>" : "load the changes saved with this page"}.</p>${staleNote}`;
    return;
  }
  const label = (S.source === "mine" ? "Your uncommitted changes" : S.source === "export" ? "Changes when this page was exported" : "Picked functions") + (S.picked && S.source !== "picked" ? ", plus picked functions" : "");
  const callers = r.layers.flat();
  const mods = new Set(callers.map(i => modName(F[i].k)));
  let h = `<h2>Impact</h2><div class="note">${label}</div>
  <div class="big"><div><b>${r.targets.length + S.testFiles.length}</b><span>changed</span></div>
  <div><b>${callers.length}</b><span>callers in ${mods.size} module${mods.size === 1 ? "" : "s"}</span></div>
  <div><b>${r.tests.length}</b><span>of ${D.tests.length} tests (${(100 * r.tests.length / D.tests.length).toFixed(1)}%)</span></div></div>`;
  h += `<div class="sec"><h5>Changed</h5>${r.targets.map(i => chip(i, "")).join("")}${S.testFiles.map(tf => `<span class="chip l2"><span class="nm">${esc(tf)}</span><span class="tag">test file</span></span>`).join("")}
    ${S.unknown.length ? `<p class="note">New code the memory hasn't traced yet: ${S.unknown.map(esc).join(", ")}</p>` : ""}</div>`;
  h += `<div class="sec"><h5>Callers <span class="depth" role="group" aria-label="Caller depth">${[1, 2, 3, 4].map(d => `<button data-depth="${d}" class="${d === S.depth ? "on" : ""}">${d}</button>`).join("")}</span></h5>`;
  if (!r.layers.length) h += `<p class="note">No package code calls ${r.targets.length > 1 ? "these" : "this"}; only tests do.</p>`;
  r.layers.forEach((l, d) => {
    const g = new Map();
    for (const i of l) { const m = modName(F[i].k); if (!g.has(m)) g.set(m, []); g.get(m).push(i); }
    h += `<div class="tag" style="margin:4px 0 3px">${d === 0 ? "Direct callers" : `Level ${d + 1}`}</div>`;
    for (const [m, is] of [...g].sort()) {
      const shown = is.slice(0, 8);
      h += `<div class="modrow"><b>${esc(m)}</b> ${shown.map(i => `<button class="link mono" data-sel="${i}">${esc(short(F[i].k))}</button>`).join(", ")}${is.length > 8 ? ` <span class="note">+${is.length - 8} more</span>` : ""}</div>`;
    }
  });
  h += `</div>`;
  const byFile = new Map();
  for (const t of r.tests) { const f = D.tests[t][0].split("::")[0]; byFile.set(f, (byFile.get(f) || 0) + 1); }
  const files = [...byFile].sort((a, b) => b[1] - a[1]);
  h += `<div class="sec"><h5>Tests that run it <span>${r.tests.length}</span></h5><ul class="plain">${files.slice(0, 12).map(([f, n]) => `<li><span>${esc(f)}</span><span>${n}</span></li>`).join("")}</ul>${files.length > 12 ? `<p class="note">+${files.length - 12} more files</p>` : ""}`;
  if (r.untested.length) h += `<p class="warn">No test runs ${r.untested.map(i => `<code>${esc(short(F[i].k))}</code>`).join(", ")}, so nothing in the memory can say what depends on ${r.untested.length > 1 ? "them" : "it"} at run time.</p>`;
  if (r.tests.length) {
    const ids = [...new Set(r.tests.map(t => D.tests[t][0].split("[")[0]))].sort();
    const sel = r.tests.length < 40 ? ids : files.map(f => f[0]).sort();
    const cmd = `python -m pytest -q ${sel.slice(0, 40).join(" ")}${sel.length > 40 ? " …" : ""}`;
    h += `<div class="row" style="margin-top:8px;justify-content:space-between"><span class="tag">Run them</span><button id="copy">Copy command</button></div><pre class="cmd" id="cmd">${esc(cmd)}</pre>`;
  }
  h += `</div>${staleNote}`;
  el.innerHTML = h;
}

function chip(i, cls) {
  const f = F[i];
  return `<span class="chip ${cls}"><span class="nm" data-sel="${i}">${esc(f.mod ? f.k : short(f.k))}</span><span class="tag">${f.t.length}</span><button data-rm="${i}" aria-label="Remove from change">×</button></span>`;
}

function summ(s) {
  if (!s) return "";
  const types = Object.entries(s.types || {}).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${t}×${n}`).join(", ");
  const flags = Object.entries(s.flags || {}).sort().map(([f, n]) => `${f}×${n}`).join(", ");
  const gaps = [];
  for (const t of Object.keys(s.types || {})) for (const g of PROBES[t] || []) if (!(s.flags || {})[g] && !gaps.includes(g)) gaps.push(g);
  return `${esc(types || "never seen")}${flags ? ` <span class="tag">[${esc(flags)}]</span>` : ""}${gaps.length ? `<div class="gap">never ${gaps.join(", ")}</div>` : ""}`;
}

function renderFn() {
  const el = $("#fn");
  if (S.sel === null) { el.hidden = true; return; }
  el.hidden = false;
  const f = F[S.sel], v = f.v, ins = S.targets.has(f.i);
  const callers = [...new Set(up[f.i])], callees = [...new Set(down[f.i])];
  const col = (is, side) => is.slice(0, 8).map(i => `<button class="link n" data-sel="${i}">${esc(short(F[i].k))}</button>`).join("") + (is.length > 8 ? `<span class="note">+${is.length - 8} more</span>` : "") || `<span class="note">${side === "l" ? "only tests" : "nothing in the package"}</span>`;
  let h = `<h2>Function</h2><div class="fnkey">${esc(qual(f.k))}</div>
  <div class="note mono">${esc(D.package.replace(/[^/]+$/, ""))}${esc(file(f.k))}${f.s ? `:${f.s}–${f.e}` : ""}</div>
  <div class="row" style="margin:10px 0 4px"><button id="toggle" class="${ins ? "" : "primary"}">${ins ? "Remove from change" : "What if I change this?"}</button>
  <span class="note">${f.t.length} tests run it${v ? ` · ${v.calls.toLocaleString()} calls traced` : ""}</span></div>`;
  h += `<div class="sec"><h5><span>Called by</span><span>Calls</span></h5><div class="nb"><div class="col l">${col(callers, "l")}</div><div class="me">${esc(short(f.k).split(".").slice(-2).join("."))}</div><div class="col r">${col(callees, "r")}</div></div></div>`;
  if (v) {
    const rows = Object.entries(v.args || {}).map(([a, s]) => `<tr><td>${esc(a)}</td><td>${summ(s)}</td></tr>`);
    rows.push(`<tr><td>returns</td><td>${summ(v.returns)}</td></tr>`);
    const rz = Object.entries(v.raises || {});
    if (rz.length) rows.push(`<tr><td>raises</td><td>${rz.map(([e, n]) => `${esc(e)}×${n}`).join(", ")}</td></tr>`);
    h += `<div class="sec"><h5>Values the tests passed in <span>first 30 calls per test</span></h5><table class="vals">${rows.join("")}</table></div>`;
  } else if (!f.mod) {
    h += `<div class="sec"><p class="note">No test ran this function, so there are no recorded values.</p></div>`;
  }
  if (f.t.length) {
    const names = f.t.slice(0, 10).map(t => D.tests[t][0]);
    h += `<div class="sec"><h5>Tests <span>${f.t.length}</span></h5><ul class="plain">${names.map(n => `<li><span>${esc(n)}</span><span></span></li>`).join("")}</ul>${f.t.length > 10 ? `<p class="note">+${f.t.length - 10} more</p>` : ""}</div>`;
  }
  el.innerHTML = h;
}

function select(i) {
  S.sel = i; render();
  const fn = $("#fn"), side = $("aside");
  if (innerWidth <= 980) fn.scrollIntoView({behavior: "smooth", block: "start"});
  else side.scrollTo({top: Math.min(fn.offsetTop, Math.max(side.scrollTop, fn.offsetTop + fn.offsetHeight - side.clientHeight)), behavior: "smooth"});
}
function toggleTarget(i) {
  S.targets.has(i) ? S.targets.delete(i) : S.targets.add(i);
  if (S.source === "mine" || S.source === "export") S.picked = true; else S.source = "picked";
  render();
}
function applyChanges(res) {
  S.targets = new Set(); S.unknown = [];
  for (const k of res.changed) { const i = byKey.get(k); if (i === undefined) S.unknown.push(k); else S.targets.add(i); }
  S.testFiles = res.test_files || []; S.stale = res.files_changed_since_record || S.stale;
  S.source = live ? "mine" : "export"; S.picked = false;
}
async function loadMine(quiet) {
  if (!live) return;
  const b = $("#mine"); b.disabled = true; b.textContent = "Diffing…";
  try {
    const res = await (await fetch("/api/changes")).json();
    if (res.error) throw new Error(res.error);
    if (!quiet || res.changed.length || res.test_files.length) applyChanges(res);
    else S.stale = res.files_changed_since_record;
    if (!quiet && !res.changed.length && !res.test_files.length) S.source = "mine";
  } catch (e) { if (!quiet) $("#impact").innerHTML = `<h2>Impact</h2><p class="err">${esc(e.message)}</p>`; }
  b.disabled = false; b.textContent = "My uncommitted changes";
}

document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("#results") || t.closest(".cell")) return;
  if (t.dataset.sel !== undefined) select(+t.dataset.sel);
  else if (t.dataset.rm !== undefined) { S.targets.delete(+t.dataset.rm); render(); }
  else if (t.dataset.depth) { S.depth = +t.dataset.depth; render(); }
  else if (t.id === "toggle") toggleTarget(S.sel);
  else if (t.id === "clear") { S.targets.clear(); S.testFiles = []; S.unknown = []; S.source = null; S.picked = false; S.sel = null; render(); }
  else if (t.id === "mine") { if (live) { await loadMine(false); render(); } else { applyChanges(JSON.parse($("#embedded").textContent).changes); render(); } }
  else if (t.id === "copy") {
    const txt = $("#cmd").textContent;
    try { await navigator.clipboard.writeText(txt); t.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents($("#cmd")); getSelection().removeAllRanges(); getSelection().addRange(r); t.textContent = "Selected, press Ctrl-C"; }
    setTimeout(() => t.textContent = "Copy command", 1600);
  }
  if (!t.closest(".search")) $("#results").hidden = true;
});

let hits = [], hi = 0;
function search(q) {
  q = q.trim();
  const m = q.match(/^(.+\.py):(\d+)$/);
  if (m) {
    const n = +m[2], path = m[1].replace(/^.*?(?=[^/]+\/)/, "");
    const cands = F.filter(f => !f.mod && (path.endsWith(file(f.k)) || file(f.k).endsWith(m[1].replace(/^src\//, ""))) && f.s <= n && n <= f.e);
    return cands.sort((a, b) => (a.e - a.s) - (b.e - b.s)).slice(0, 1);
  }
  const lq = q.toLowerCase();
  return F.filter(f => !f.mod && f.k.toLowerCase().includes(lq))
    .sort((a, b) => (qual(a.k).toLowerCase().endsWith(lq) ? 0 : 1) - (qual(b.k).toLowerCase().endsWith(lq) ? 0 : 1) || b.t.length - a.t.length).slice(0, 14);
}
function showHits() {
  const r = $("#results");
  if (!hits.length) { r.innerHTML = `<div class="note" style="padding:8px 10px">No function matches.</div>`; r.hidden = false; return; }
  r.innerHTML = hits.map((f, j) => `<button data-hit="${j}" class="${j === hi ? "on" : ""}">${esc(qual(f.k))}<small>${esc(file(f.k))}:${f.s} · ${f.t.length} tests</small></button>`).join("");
  r.hidden = false;
}
$("#q").addEventListener("input", e => { const q = e.target.value; if (q.trim().length < 2) { $("#results").hidden = true; return; } hits = search(q); hi = 0; showHits(); });
$("#q").addEventListener("keydown", e => {
  if ($("#results").hidden) return;
  if (e.key === "ArrowDown") { hi = Math.min(hi + 1, hits.length - 1); showHits(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { hi = Math.max(hi - 1, 0); showHits(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[hi]) { pick(hits[hi], e.shiftKey); }
  else if (e.key === "Escape") $("#results").hidden = true;
});
$("#results").addEventListener("click", e => { const b = e.target.closest("[data-hit]"); if (b) pick(hits[+b.dataset.hit], e.shiftKey); });
function pick(f, add) { $("#results").hidden = true; $("#q").value = ""; if (add) toggleTarget(f.i); select(f.i); }

boot();
</script>
</body>
</html>
